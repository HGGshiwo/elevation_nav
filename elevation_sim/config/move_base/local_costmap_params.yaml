# 局部 costmap: ManifoldCostmapLayer 插件 (move_base 进程内) 仅承载实时点云融合
# (ManifoldFusionEngine → GraphStore 融合图, 供 AStarLocalPlanner 零拷贝读图);
# 地毯渲染链路已删除, 代价网格无数据产出 (恢复行为已禁用, 无规划消费者)
local_costmap:
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 1.0
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins:
    - {name: elevation_manifold_layer, type: "elevation_costmap::ManifoldCostmapLayer"}
  elevation_manifold_layer:
    cloud_topic: /lidar_points
    fusion_rate: 10.0          # 融合节拍 (Hz)
    crop_radius_xy: 3.5        # 实时点云融合 ROI 裁剪半径 (m)
    crop_height_above: 2.0     # 机体上方净空高度截取范围 (m)
    crop_height_below: 1.5     # 机体下方脚底高度截取范围 (m)
