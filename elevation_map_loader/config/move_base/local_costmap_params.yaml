# 局部 costmap: 订阅独立 elevation_costmap 节点发布的 1:1 地毯代价地图 (非阻塞异步)
local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins:
    - {name: elevation_manifold_layer, type: "elevation_costmap::ManifoldCostmapLayer"}
  elevation_manifold_layer:
    map_topic: /elevation_local_costmap
    map_width: 6.0
    map_length: 6.0
    forward_offset: 3.0
